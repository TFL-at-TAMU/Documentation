<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Fab Lab Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Documentation and manuals for The Fab Lab">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Set the light/dark theme BEFORE first paint to avoid a flash. Order of precedence:
       saved preference (localStorage) -> the visitor's OS/browser setting -> light. -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- Web fonts: Inter for readable body text, Space Grotesk for the "The Fab Lab" title -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">

  <!-- Docsify Core CSS Theme -->
  <!-- docsify-themeable "simple" (light) base. Both light AND dark Gruvbox palettes are layered
       on top via [data-theme] in the <style> block below, so this single base serves both modes. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">
  
  <!-- Sidebar Collapse Plugin CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />
  
  <style>
    /* ===== Gruvbox theme: light + dark, switched via [data-theme] on <html> =====
       Built on docsify-themeable's "simple" (light) base. Raw palette hex values are defined
       once in :root; each mode then maps docsify-themeable's semantic variables to the light or
       dark set. The dark block also inverts themeable's internal "mono" scale so derived surfaces
       (borders, code/table/blockquote backgrounds) come out dark too.
       Palette: https://github.com/morhetz/gruvbox */
    :root {
      /* Gruvbox DARK constants */
      --gb-d-bg0-hard: #1d2021;
      --gb-d-bg0:      #282828;
      --gb-d-bg1:      #3c3836;
      --gb-d-bg2:      #504945;
      --gb-d-fg0:      #fbf1c7;
      --gb-d-fg1:      #ebdbb2;
      --gb-d-fg4:      #a89984;
      --gb-d-yellow:   #fabd2f;
      --gb-d-orange:   #fe8019;
      --gb-d-aqua:     #8ec07c;

      /* Gruvbox LIGHT constants (accents use the darker "faded" variants for contrast on cream) */
      --gb-l-bg0-hard: #f9f5d7;
      --gb-l-bg0:      #fbf1c7;
      --gb-l-bg1:      #ebdbb2;
      --gb-l-bg2:      #d5c4a1;
      --gb-l-fg0:      #282828;
      --gb-l-fg1:      #3c3836;
      --gb-l-fg4:      #7c6f64;
      --gb-l-yellow:   #b57614;
      --gb-l-orange:   #af3a03;
      --gb-l-aqua:     #427b58;

      /* Typography (mode-independent): Inter body, looser line-height for readability */
      --base-font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --base-font-size:   17px;
      --base-line-height: 1.7;
      --heading-font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    /* ---------- LIGHT mode ---------- */
    :root[data-theme="light"] {
      --theme-color:           var(--gb-l-yellow);
      --base-background-color: var(--gb-l-bg0);
      --base-color:            var(--gb-l-fg1);
      --heading-color:         var(--gb-l-fg0);
      --link-color:            var(--gb-l-yellow);
      --link-color--hover:     var(--gb-l-orange);

      --sidebar-background:                    var(--gb-l-bg0-hard);
      --sidebar-name-color:                    var(--gb-l-yellow);
      --sidebar-nav-link-color:                var(--gb-l-fg1);
      --sidebar-nav-link-color--active:        var(--gb-l-yellow);
      --sidebar-nav-link-border-color--active: var(--gb-l-yellow);

      --search-input-background-color: var(--gb-l-bg1);
      --search-input-color:            var(--gb-l-fg1);
      --search-result-heading-color:   var(--gb-l-yellow);
      --search-result-item-color:      var(--gb-l-fg1);

      --code-inline-background: var(--gb-l-bg1);
      --code-inline-color:      var(--gb-l-orange);
      --code-theme-background:  var(--gb-l-bg1);

      --blockquote-border-color: var(--gb-l-aqua);
      --border-color:            var(--gb-l-bg2);
    }

    /* ---------- DARK mode ---------- */
    :root[data-theme="dark"] {
      --theme-color:           var(--gb-d-yellow);
      --base-background-color: var(--gb-d-bg0);
      --base-color:            var(--gb-d-fg1);
      --heading-color:         var(--gb-d-fg0);
      --link-color:            var(--gb-d-yellow);
      --link-color--hover:     var(--gb-d-orange);

      --sidebar-background:                    var(--gb-d-bg0-hard);
      --sidebar-name-color:                    var(--gb-d-yellow);
      --sidebar-nav-link-color:                var(--gb-d-fg1);
      --sidebar-nav-link-color--active:        var(--gb-d-yellow);
      --sidebar-nav-link-border-color--active: var(--gb-d-yellow);

      --search-input-background-color: var(--gb-d-bg1);
      --search-input-color:            var(--gb-d-fg1);
      --search-result-heading-color:   var(--gb-d-yellow);
      --search-result-item-color:      var(--gb-d-fg1);

      --code-inline-background: var(--gb-d-bg1);
      --code-inline-color:      var(--gb-d-orange);
      --code-theme-background:  var(--gb-d-bg0-hard);

      --blockquote-border-color: var(--gb-d-aqua);
      --border-color:            var(--gb-d-bg2);

      /* Invert themeable's internal "mono" scale so derived surfaces are dark too.
         (Tints = surface backgrounds, shades = text — flipped for a dark background.) */
      --mono-shade3: var(--gb-d-fg0);
      --mono-shade2: var(--gb-d-fg1);
      --mono-shade1: var(--gb-d-fg4);
      --mono-base:   #928374;
      --mono-tint1:  var(--gb-d-bg2);
      --mono-tint2:  var(--gb-d-bg1);
      --mono-tint3:  var(--gb-d-bg0);
    }

    /* Keep the page background in sync with the active mode. */
    body { background-color: var(--base-background-color); }

    /* ===== Top navigation bar =====
       Full-width bar holding the brand, nav links, search, and the light/dark toggle.
       Fixed on desktop (sidebar + content shift down beneath it); on mobile it scrolls
       away with the page (see the media query). */
    :root { --topbar-h: 56px; }

    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--topbar-h);
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 0 1rem 0 1.25rem;
      background: var(--sidebar-background);
      border-bottom: 1px solid var(--border-color);
      z-index: 20;
    }
    .topbar-brand {
      font-family: 'Space Grotesk', var(--base-font-family);
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--theme-color);
      text-decoration: none;
      white-space: nowrap;
    }
    .topbar-nav { display: flex; gap: 1.25rem; }
    .topbar-nav a {
      color: var(--base-color);
      text-decoration: none;
      font-size: 0.95rem;
      opacity: 0.8;
      white-space: nowrap;
    }
    .topbar-nav a:hover { color: var(--theme-color); opacity: 1; }
    /* Right-aligned cluster (search + toggle). */
    .topbar-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    /* GitHub corner: pinned to the viewport's top-right, tucked just under the top bar
       (z-index below the bar so the two never overlap). */
    .github-corner {
      position: fixed;
      top: var(--topbar-h);
      right: 0;
      z-index: 10;
    }
    /* The octocat is rendered as a true cutout — a hole punched in the solid ribbon — by
       githubCutoutPlugin below, so the page content shows through the cat shape. */

    /* Shift docsify's fixed sidebar and (statically-positioned) content below the bar. */
    .sidebar { top: var(--topbar-h); }
    .content { padding-top: var(--topbar-h); }

    /* Search, relocated into the bar: compact input + an absolutely-positioned dropdown. */
    .topbar .search { margin: 0; padding: 0; border: 0; position: relative; }
    .topbar .search .input-wrap { margin: 0; }
    .topbar .search input {
      width: 15rem; height: 2.1rem; margin: 0; padding: 0 0.6rem;
      font-size: 0.9rem; border-radius: 6px;
    }
    .topbar .search .results-panel {
      position: absolute; top: calc(100% + 6px); right: 0;
      width: 24rem; max-width: 80vw; max-height: 70vh; overflow-y: auto;
      background: var(--sidebar-background);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      padding: 0.25rem 0.75rem;
    }
    .topbar .search .results-panel:empty { display: none; }   /* hide the dropdown when there are no results */

    /* Light/dark toggle button (lives in the top bar's action cluster). */
    .theme-toggle {
      display: flex; align-items: center; justify-content: center;
      width: 2rem; height: 2rem; padding: 0;
      flex: none;
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--base-color);
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .theme-toggle:hover { color: var(--theme-color); border-color: var(--theme-color); }
    .theme-toggle svg { width: 1.1rem; height: 1.1rem; }

    /* Mobile: the bar stays pinned (persistent). The hamburger (left) handles nav, so hide the
       wordmark + nav links and let search fill the width. */
    @media (max-width: 768px) {
      .topbar { gap: 0.5rem; padding: 0 0.75rem 0 3rem; }
      .topbar-brand, .topbar-nav { display: none; }
      .topbar-actions { margin-left: 0; flex: 1; gap: 0.5rem; }
      .topbar .search { flex: 1; }
      .topbar .search input { width: 100%; }
      /* Keep docsify's hamburger above the bar (it sits in the reserved left padding). */
      .sidebar-toggle { z-index: 25; }
    }

    /* "Edit this page on GitHub" link. Rendered as a footer at the bottom of each page
       so it stays clear of the GitHub corner in the top-right (they overlapped on mobile). */
    .edit-on-github {
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
      font-size: 0.9em;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <!-- Docsify will inject its UI into this element -->
  <div id="app">Loading...</div>

  <script>
    // Docsify Configuration Object
    // This is where all the settings for the website are defined.
    // Future Maintainers: Check https://docsify.js.org/#/configuration for more options.
    window.$docsify = {
      // Sidebar wordmark is disabled; the brand lives in the custom top bar instead.
      name: '',
      
      // Provides a GitHub corner link on the top right
      repo: 'TFL-at-TAMU/Documentation',

      // Configuration for the homepage. 
      // Since our main overview doc is named "The Fab Lab README.md", we set it here.
      homepage: 'The Fab Lab README.md',

      // Tells Docsify to load the navigation structure from the _sidebar.md file
      loadSidebar: true,
      
      // Automatically add a header to pages based on the directory/file name if none is present
      autoHeader: true,

      // Determines how deep the sidebar should auto-generate sub-links based on markdown headers (h1, h2, etc.)
      subMaxLevel: 2,

      // Dictates the default collapse level for the sidebar (0 means top-level folders are collapsed)
      sidebarDisplayLevel: 0,

      // Configuration for the built-in search plugin
      search: {
        paths: 'auto',              // Automatically index all files
        placeholder: 'Search documentation...',
        noData: 'No results found.',
        depth: 3                    // How deep to parse headings for search content
      }
    }
  </script>

  <!-- Docsify Core JavaScript engine -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  
  <!-- docsify-themeable script -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/js/docsify-themeable.min.js"></script>

  <!-- Search Plugin: Allows users to search through all Markdown files across the site -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

  <!-- Copy to Clipboard Plugin: Adds a convenient 'Copy' button directly on code blocks -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>

  <!-- Sidebar Collapse Plugin: Allows users to collapse/expand nested directories in the sidebar -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>

  <!-- Flexible Alerts Plugin: Renders > [!NOTE] and > [!CAUTION] markdown blockquotes correctly -->
  <script src="https://unpkg.com/docsify-plugin-flexible-alerts"></script>

  <!-- Edit on GitHub: a small custom Docsify plugin that appends an "Edit this page on GitHub"
       link to the BOTTOM of each page. The docsify-edit-on-github plugin placed it at the top,
       where it overlapped the GitHub corner on mobile. The link targets the matching file under
       /docs/ on the 'main' branch so edits go straight to the source. -->
  <script>
    // Top navigation bar: builds a full-width bar with the brand, nav links, the relocated
    // search box, and the light/dark toggle. Created once, then search is moved into it.
    function topbarPlugin(hook) {
      var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
      var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
      function curTheme() { return document.documentElement.getAttribute('data-theme') || 'light'; }
      function makeToggle() {
        var btn = document.createElement('button');
        btn.className = 'theme-toggle';
        btn.type = 'button';
        var dark = curTheme() === 'dark';
        btn.innerHTML = dark ? SUN : MOON;   // show the icon for the mode you'd switch TO
        var label = dark ? 'Switch to light mode' : 'Switch to dark mode';
        btn.setAttribute('aria-label', label);
        btn.setAttribute('title', label);
        btn.addEventListener('click', function () {
          // Persist the choice, then reload. docsify-themeable bakes some colors at render
          // time, so an in-place attribute flip doesn't fully repaint; a reload re-renders
          // cleanly, and the no-FOUC <head> script applies the saved theme before first paint.
          var next = curTheme() === 'dark' ? 'light' : 'dark';
          try { localStorage.setItem('theme', next); } catch (e) {}
          document.documentElement.setAttribute('data-theme', next);
          window.location.reload();
        });
        return btn;
      }
      hook.doneEach(function () {
        var bar = document.querySelector('.topbar');
        if (!bar) {
          bar = document.createElement('header');
          bar.className = 'topbar';
          bar.innerHTML =
            '<a class="topbar-brand" href="#/">The Fab Lab</a>' +
            '<nav class="topbar-nav">' +
              '<a href="#/">Home</a>' +
              '<a href="#/">Documentation</a>' +
              '<a href="#/">Contact</a>' +
            '</nav>' +
            '<div class="topbar-actions"></div>';
          document.body.insertBefore(bar, document.body.firstChild);
          bar.querySelector('.topbar-actions').appendChild(makeToggle());
        }
        // Relocate docsify's search box into the bar (once). Moving the DOM node preserves
        // the search plugin's event bindings, so its behavior is unchanged.
        var actions = bar.querySelector('.topbar-actions');
        var search = document.querySelector('.search');
        if (search && !bar.contains(search)) {
          actions.insertBefore(search, actions.firstChild);
        }
      });
    }

    // GitHub corner cutout: punch the octocat out of the solid ribbon so the page content
    // shows through the cat-shaped hole. Builds an SVG <mask> (white = keep, black = cut) from
    // the octocat paths, applies it to the triangle, then hides the original filled cat paths.
    function githubCutoutPlugin(hook) {
      function apply() {
        var svg = document.querySelector('.github-corner svg');
        if (!svg || svg.dataset.cutout) return;
        var triangle = svg.querySelector('path:not(.octo-arm):not(.octo-body)');
        var arm = svg.querySelector('.octo-arm');
        var body = svg.querySelector('.octo-body');
        if (!triangle || !arm || !body) return;
        var NS = 'http://www.w3.org/2000/svg';
        var vb = (svg.getAttribute('viewBox') || '0 0 250 250').split(/\s+/);
        var mask = document.createElementNS(NS, 'mask');
        mask.setAttribute('id', 'gh-octocat-cutout');
        mask.setAttribute('maskUnits', 'userSpaceOnUse');
        var rect = document.createElementNS(NS, 'rect');
        rect.setAttribute('x', vb[0]); rect.setAttribute('y', vb[1]);
        rect.setAttribute('width', vb[2]); rect.setAttribute('height', vb[3]);
        rect.setAttribute('fill', 'white');                 // keep the whole ribbon...
        mask.appendChild(rect);
        [arm, body].forEach(function (p) {
          var c = p.cloneNode(true);
          c.removeAttribute('class');
          c.setAttribute('fill', 'black');                  // ...except the cat shape (cut out)
          c.style.display = '';
          mask.appendChild(c);
        });
        svg.insertBefore(mask, svg.firstChild);
        triangle.setAttribute('mask', 'url(#gh-octocat-cutout)');
        arm.style.display = 'none';                         // hide the original filled cat paths
        body.style.display = 'none';
        svg.dataset.cutout = '1';
      }
      hook.ready(apply);
      hook.doneEach(apply);
    }

    // Edit on GitHub: appends an "Edit this page on GitHub" link to the BOTTOM of each page,
    // targeting the matching file under /docs/ on the 'main' branch.
    function editOnGithubPlugin(hook, vm) {
      hook.afterEach(function (html, next) {
        var editUrl = 'https://github.com/TFL-at-TAMU/Documentation/edit/main/docs/' + vm.route.file;
        var button =
          '<div class="edit-on-github">' +
          '<a href="' + editUrl + '" target="_blank" rel="noopener noreferrer">✏️ Edit this page on GitHub</a>' +
          '</div>';
        next(html + button);
      });
    }

    window.$docsify.plugins = [topbarPlugin, githubCutoutPlugin, editOnGithubPlugin].concat(window.$docsify.plugins || []);
  </script>
</body>
</html>
